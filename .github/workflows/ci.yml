name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-password
          POSTGRES_USER: suimoney
          POSTGRES_DB: suimoney_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U suimoney -d suimoney_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_MODE: mock
      APP_ORIGIN: http://localhost:3000
      DATABASE_URL: postgres://suimoney:test-password@localhost:5432/suimoney_test
      TEST_DATABASE_URL: postgres://suimoney:test-password@localhost:5432/suimoney_test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:quality
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: quality-evidence
          path: |
            evidence/public/quality.json
            evidence/public/db-tests.json
            evidence/public/personal-browser.json
          retention-days: 14
